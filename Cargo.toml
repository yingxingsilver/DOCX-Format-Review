[workspace]
resolver = "2"
members = [
    "crates/format_core",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["paper-format-auditor"]

[workspace.dependencies]
# 核心解析依赖（P1 起正式使用，骨架阶段先声明版本策略）
zip = "2"
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rayon = "1.10"
thiserror = "1"

[profile.release]
strip = true
lto = true
