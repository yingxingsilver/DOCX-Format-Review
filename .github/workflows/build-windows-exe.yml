name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release 版本号 (如 v1.0.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-exe:
    name: 构建 Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: windows-exe
          cache-all-crates: "true"

      - name: Install frontend dependencies and build
        run: |
          npm ci
          npm run build

      - name: Create Git Tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "${{ inputs.version_tag }}" >/dev/null 2>&1; then
            git tag ${{ inputs.version_tag }}
            git push origin ${{ inputs.version_tag }}
          fi

      # 强制不打包，仅生成裸 EXE
      - name: Build Windows EXE (no bundle)
        run: npx --no-install tauri build --no-bundle

      # 使用通配符 *.exe 彻底避免文件名匹配失败
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.version_tag }}
          draft: true
          append_body: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/*.exe
