name: CI

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release 版本号 (如 v1.0.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: release-windows
          cache-all-crates: "true"

      - name: Install frontend deps & build
        run: |
          npm ci
          npm run build

      - name: Create Tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "${{ inputs.version_tag }}" >/dev/null 2>&1; then
            git tag ${{ inputs.version_tag }}
            git push origin ${{ inputs.version_tag }}
          fi

      - name: Tauri Build (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.version_tag }}
          releaseName: "论文格式审核系统 ${{ inputs.version_tag }}"
          releaseBody: "Windows NSIS 安装包 | Commit: ${{ github.sha }}"
          releaseDraft: false
