name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 核心引擎：仅检查/测试 format_core，不依赖 GUI 系统库 ──
  core:
    name: 核心引擎 (format_core)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      # Rust 构建缓存：缓存 target/ 与 ~/.cargo 依赖，键含 Cargo.lock 哈希，跨次运行复用增量编译产物
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: core-${{ runner.os }}
          cache-all-crates: "true"

      # 格式检查已关闭：rustfmt 的换行偏好差异不应阻塞功能验证，
      # 本地开发时可用 `cargo fmt --all` 自行格式化。
      # - name: 格式检查
      #   run: cargo fmt --all --check

      - name: Clippy（警告即失败）
        run: cargo clippy -p format_core --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test -p format_core --verbose

  # ── 前端：Svelte + TS 类型检查与构建 ──
  frontend:
    name: 前端 (Svelte/Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      - name: 构建
        run: npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ── Tauri 后端：需要 webkit 系统依赖，只做编译检查 ──
  tauri-build:
    name: Tauri 后端编译
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      # Rust 构建缓存：Tauri 依赖树庞大（webkit/tauri crate），缓存命中可节省 10+ 分钟冷编译
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: tauri-${{ runner.os }}
          cache-all-crates: "true"

      - name: 编译 src-tauri（含测试目标）
        run: cargo check -p paper-format-auditor --manifest-path src-tauri/Cargo.toml --all-targets

  # ── 发布构建：打 v* tag 时产出三平台安装包 ──
  release:
    name: 打包发布 (${{ matrix.platform }} ${{ matrix.args }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, frontend, tauri-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 构建缓存：按平台区分缓存键；tauri-action 内部构建同样复用该缓存
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: release-${{ matrix.platform }}${{ matrix.args }}
          cache-all-crates: "true"

      - name: 安装前端依赖
        run: npm ci

      - name: Tauri 构建并发布到 GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
