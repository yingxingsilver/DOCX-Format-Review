name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      do_release:
        description: '是否打包并发布到 Releases？(勾选即打包)'
        type: boolean
        default: false
      version_tag:
        description: 'Release 版本号 (仅打包时需要，如 v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 核心引擎：仅检查/测试 format_core ──
  core:
    name: 核心引擎 (format_core)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: core-${{ runner.os }}
          cache-all-crates: "true"

      - name: Clippy（警告即失败）
        run: cargo clippy -p format_core --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test -p format_core --verbose

  # ── 前端：Svelte + TS 类型检查与构建 ──
  frontend:
    name: 前端 (Svelte/Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      - name: 构建
        run: npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ── Tauri 后端编译检查 ──
  tauri-build:
    name: Tauri 后端编译
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: tauri-${{ runner.os }}
          cache-all-crates: "true"

      - name: 编译 src-tauri（含测试目标）
        run: cargo check -p paper-format-auditor --manifest-path src-tauri/Cargo.toml --all-targets

  # ── 发布构建：只产出裸可执行文件，不生成安装包 ──
  release:
    name: 构建 EXE (${{ matrix.platform }})
    if: >-
      startsWith(github.ref, 'refs/tags/v') || 
      (github.event_name == 'workflow_dispatch' && inputs.do_release == true)
    needs: [core, frontend, tauri-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: paper-format-auditor
          - platform: windows-latest
            artifact: paper-format-auditor.exe
          - platform: macos-latest
            artifact: paper-format-auditor
            target: aarch64-apple-darwin
          - platform: macos-latest
            artifact: paper-format-auditor
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: release-${{ matrix.platform }}${{ matrix.target || '' }}
          cache-all-crates: "true"

      - name: 安装前端依赖并构建
        run: |
          npm ci
          npm run build

      # ★ Tag 幂等创建
      - name: 为手动触发创建临时 Tag
        if: github.event_name == 'workflow_dispatch' && inputs.version_tag != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "${{ inputs.version_tag }}" >/dev/null 2>&1; then
            git tag ${{ inputs.version_tag }}
            git push origin ${{ inputs.version_tag }}
            echo "✅ Created and pushed tag ${{ inputs.version_tag }}"
          else
            echo "⚠️ Tag ${{ inputs.version_tag }} already exists, skipping"
          fi

      # ★ 使用 tauri-action 但 targets:["none"] 使其只编译不打包
      - name: Tauri Build (EXE only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag != '' && inputs.version_tag || github.ref_name }}
          releaseName: "App ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag != '' && inputs.version_tag || github.ref_name }}"
          releaseBody: "由 GitHub Actions 自动构建 (仅可执行文件) | Commit: ${{ github.sha }}"
          releaseDraft: true
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # ★ tauri-action 在 targets:["none"] 时不会自动上传产物，需手动上传
      - name: 上传可执行文件到 Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag != '' && inputs.version_tag || github.ref_name }}
          draft: true
          append_body: true
          files: |
            src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/${{ matrix.artifact }}
